name: verifiable-build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
      - name: Check source values
        run: |
          if grep -rn '__ON''CE_' programs client README.md SECURITY.md; then exit 1; fi
      - name: Install verifier
        run: cargo install solana-verify --version 0.5.2 --locked
      - name: Verifiable build
        run: solana-verify build --library-name once
      - name: Executable hash
        run: |
          solana-verify get-executable-hash target/deploy/once.so | tee once.so.sha256
          cp target/deploy/once.so once.so
      - name: Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '24'
      - name: Test built binary
        run: |
          sudo chown -R "$(id -u):$(id -g)" target
          npm ci
          npm test
      - name: Upload binary
        uses: actions/upload-artifact@v4.6.2
        with:
          name: once-verifiable-build
          path: |
            once.so
            once.so.sha256
